## POC overrides on top of the image's 10-defaults.conf.

## The image allows guest from any host; restrict it (the entrypoint also deletes it).
loopback_users.guest = true

## Plain AMQP for in-VPC clients (telemetry worker); security groups restrict it.
listeners.tcp.default = 5672

## TLS for laptops arriving through the network load balancer.
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/cert.pem
ssl_options.keyfile = /etc/rabbitmq/tls/key.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

## Small Fargate task: keep headroom below the container memory limit.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
